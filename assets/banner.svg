<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.5" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="130" fill="#ff4fa3" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1040" cy="330" r="150" fill="#7c5cff" opacity="0.3" filter="url(#glow)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="190" font-size="96" font-weight="800" fill="url(#txt)">/handle-boss</text>
    <text x="600" y="250" font-size="30" fill="#e8e6ff">Give it the task. A team of agents finishes it.</text>
    <text x="600" y="296" font-size="22" fill="#a9a6d6">Cheap models for easy work  ·  strong models only when needed  ·  Opus only with your yes</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="365" y="325" width="140" height="42" rx="21" fill="#2dd4bf"/><text x="435" y="353" fill="#06302b">Haiku 5.5</text>
    <rect x="530" y="325" width="140" height="42" rx="21" fill="#818cf8"/><text x="600" y="353" fill="#120f3d">Sonnet 5.5</text>
    <rect x="695" y="325" width="140" height="42" rx="21" fill="#fb7185"/><text x="765" y="353" fill="#3b0714">Opus 5.5</text>
  </g>
</svg>
