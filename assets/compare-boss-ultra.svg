<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <style>
    .bar{transform-origin:left center;transform:scaleX(0);animation:grow 1.2s ease-out forwards}
    .b2{animation-delay:.35s}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
  <rect width="1000" height="340" rx="20" fill="#0f172a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f5f9">Loading both features: words in context</text>
    <text x="500" y="74" text-anchor="middle" font-size="15" fill="#94a3b8">Measured with wc -w on each SKILL.md. Smaller = cheaper every time it loads.</text>

    <text x="40" y="150" font-size="17" fill="#cbd5e1">handle-boss</text>
    <text x="40" y="170" font-size="17" fill="#cbd5e1">+ token-saver</text>
    <rect x="190" y="125" width="680" height="38" rx="8" fill="#334155"/>
    <rect class="bar" x="190" y="125" width="680" height="38" rx="8" fill="#94a3b8"/>
    <text x="880" y="151" font-size="18" font-weight="700" fill="#f1f5f9">1,304</text>

    <text x="40" y="226" font-size="18" fill="#fbbf24" font-weight="700">boss-ultra</text>
    <rect x="190" y="201" width="680" height="38" rx="8" fill="#334155"/>
    <rect class="bar b2" x="190" y="201" width="265" height="38" rx="8" fill="#f59e0b"/>
    <text x="465" y="227" font-size="18" font-weight="700" fill="#fbbf24">508  (-61%)</text>

    <text x="500" y="298" text-anchor="middle" font-size="14" fill="#94a3b8">1,304 = handle-boss 987 + token-saver 317. boss-ultra is a condensed standalone version of both.</text>
  </g>
</svg>
