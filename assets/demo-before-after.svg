<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <style>
    text{font-family:Consolas,Menlo,monospace}
    .l{opacity:0;animation:show .01s linear forwards}
    @keyframes show{to{opacity:1}}
    .a1{animation-delay:.4s}.a2{animation-delay:.9s}.a3{animation-delay:1.4s}.a4{animation-delay:1.9s}
    .c1{animation-delay:2.6s}.c2{animation-delay:3.1s}.c3{animation-delay:3.6s}
    .tag{opacity:0;animation:show .01s linear forwards;animation-delay:4.3s}
    .loop{animation:fade 9s linear infinite}
    @keyframes fade{0%,92%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="1000" height="380" rx="20" fill="#0f172a"/>
  <g>
    <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f5f9" style="font-family:Segoe UI,Arial,sans-serif">Why does my React component re-render?</text>

    <rect x="30" y="60" width="450" height="270" rx="14" fill="#1e293b"/>
    <text x="50" y="92" font-size="15" font-weight="700" fill="#94a3b8">BEFORE  (31 words)</text>
    <text class="l a1" x="50" y="130" font-size="14" fill="#cbd5e1">Sure! I'd be happy to help. The reason</text>
    <text class="l a2" x="50" y="156" font-size="14" fill="#cbd5e1">your component re-renders is likely that</text>
    <text class="l a3" x="50" y="182" font-size="14" fill="#cbd5e1">you create a new object each render, so</text>
    <text class="l a4" x="50" y="208" font-size="14" fill="#cbd5e1">React sees a new prop. Wrap it in useMemo.</text>

    <rect x="520" y="60" width="450" height="270" rx="14" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="540" y="92" font-size="15" font-weight="700" fill="#5eead4">AFTER  token-saver full  (14 words)</text>
    <text class="l c1" x="540" y="130" font-size="14" fill="#ccfbf1">New object each render = new prop</text>
    <text class="l c2" x="540" y="156" font-size="14" fill="#ccfbf1">ref = re-render.</text>
    <text class="l c3" x="540" y="182" font-size="14" fill="#5eead4">Fix: wrap in `useMemo`.</text>
    <text class="tag" x="540" y="250" font-size="16" font-weight="700" fill="#fbbf24">-55% words, same fix</text>
    <text class="tag" x="540" y="276" font-size="13" fill="#94a3b8">Illustrative example, counted with wc -w.</text>
  </g>
</svg>
